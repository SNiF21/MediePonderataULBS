<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fadeIn">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 sm:p-7 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
    
    <div class="flex items-center space-x-3.5 pb-1">
      <div class="w-10 h-10 rounded-2xl bg-amber-500/10 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <div>
        <h3 class="font-extrabold text-base sm:text-lg text-slate-900 dark:text-white tracking-tight">
          Resetezi notele semestrului?
        </h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          {{ yearLabel() }} • {{ semesterLabel() }}
        </p>
      </div>
    </div>

    <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/70 text-xs text-slate-700 dark:text-slate-300 leading-relaxed space-y-1.5">
      <p>
        Toate notele introduse și opțiunile alese pentru această sesiune vor fi golite.
      </p>
      <p *ngIf="isLoggedIn()" class="text-slate-500 dark:text-slate-400 text-[11px]">
        Modificarea se va sincroniza și în contul tău de cloud.
      </p>
    </div>

    <div class="flex items-center justify-end gap-2.5 pt-2">
      <button
        type="button"
        (click)="cancel()"
        class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
      >
        Renunță
      </button>

      <button
        type="button"
        (click)="confirm()"
        class="px-4 py-2 text-xs font-semibold rounded-xl bg-rose-600 hover:bg-rose-700 text-white shadow-sm shadow-rose-600/30 transition cursor-pointer"
      >
        Confirmă resetarea
      </button>
    </div>

  </div>
</div>
